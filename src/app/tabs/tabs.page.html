<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar color="medium">
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list [inset]="true">
      <ion-item>
      <ion-toggle [(ngModel)]="paletteToggle" (ionChange)="toggleChange($event)" justify="space-between">Dark Mode</ion-toggle>
    </ion-item>
      <ion-item>
        <ion-icon name="people-outline" size="small"></ion-icon>
        <ion-menu-toggle>
             <ion-button fill="clear" color="dark" (click)="openRubrica()" class="all">Rubrica</ion-button>
        </ion-menu-toggle>
      </ion-item>
      <ion-item>
        <ion-icon name="flash" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="dark" (click)="openBackground()" class="all">Background</ion-button>
          </ion-menu-toggle>
      </ion-item>
      <ion-item>
        <ion-icon name="git-compare-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="dark" (click)="openPregi()" class="all">Pregi e Difetti</ion-button>
          </ion-menu-toggle>
      </ion-item>
      <ion-item>
        <ion-icon name="water-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="dark" (click)="openCaccia()" class="all">Caccia</ion-button>
          </ion-menu-toggle>
      </ion-item>
      <ion-item>
        <ion-icon name="reader-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="dark" (click)="openNote()" class="all">Annotazioni</ion-button>
          </ion-menu-toggle>
      </ion-item>
      <ion-item>
        <ion-icon name="cellular-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="dark" (click)="openFocusattr()" class="all">Focus Attributi</ion-button>
          </ion-menu-toggle>
      </ion-item> 
      <ion-item>
        <ion-icon name="flame-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="dark" (click)="openLegami()" class="all">Legami di Sangue</ion-button>
          </ion-menu-toggle>
      </ion-item>          
      <ion-item>
        <ion-icon name="skull-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="danger" (click)="openMorte()" class="all">Morte Ultima</ion-button>
          </ion-menu-toggle>
      </ion-item>
      <ion-item>
        <ion-icon name="contract-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="dark" (click)="openObiettivi()" class="all">Obiettivi di Clan</ion-button>
          </ion-menu-toggle>
      </ion-item>      
      <ion-item>
        <ion-icon name="globe-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="danger" (click)="openDT()" class="all">Downtime (DT)</ion-button>
          </ion-menu-toggle>
      </ion-item>      
      <ion-item>
        <ion-icon name="log-out-outline" size="small"></ion-icon>
          <ion-menu-toggle>
            <ion-button fill="clear" color="danger" (click)="logout()" class="all">Logout</ion-button>
          </ion-menu-toggle>
      </ion-item>      
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">

<ion-content>

  <ion-tabs >
    <ion-tab-bar slot="bottom" color="light">

      <ion-tab-button tab="tab1">
        <ion-icon name="person-outline" size="small" color="primary"></ion-icon>
        <ion-label>Scheda</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tab2">
        <ion-icon name="bulb-outline" size="small" color="primary"></ion-icon>
        <ion-label>Skill</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tab3">
        <ion-icon name="contract-outline" size="small" color="primary"></ion-icon>
        <ion-label>Analizza</ion-label>
      </ion-tab-button>
        
      <ion-tab-button tab="tab5">
        <ion-icon name="keypad-outline" size="small" color="primary"></ion-icon>
        <ion-label>Poteri</ion-label>
      </ion-tab-button>

    </ion-tab-bar>
  </ion-tabs>

  <!---------  PER FINE CACCIA -->
  <ion-toast
    [isOpen]="this.user.ToastFineCaccia"
    message="La Caccia è terminata!!"
    [duration]="5000"
    (didDismiss)="setOpen(false)"
    icon="water-outline"
  ></ion-toast>

</ion-content>

</div>

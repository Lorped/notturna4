<ion-content>

  <ion-header>
    <ion-toolbar color="medium">
      <ion-title>Aggiungi Contatto</ion-title>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
		<ion-buttons slot="end">
		  <ion-back-button defaultHref="/tabs/rubrica"></ion-back-button>
        </ion-buttons>
    </ion-toolbar>
  </ion-header> 



	<ion-row >
		<ion-col >
			&nbsp;
		</ion-col>
	</ion-row>
	
	<form (ngSubmit)="add()" #addForm="ngForm">
		<ion-row >
			<ion-col style="font-size:1.5em;">
				<ion-avatar style="margin: 0 auto;">
					<img src="assets/img/avatar.svg" alt="">
				</ion-avatar>
			</ion-col>
		</ion-row>
		<ion-row >
			<ion-col >
				<ion-item >		
			  		<ion-input style="font-size:1.5em;"  type="text" placeholder="Nome del Contatto" name="contatto" [(ngModel)]="nuovoContatto.contatto" autofocus required ></ion-input>
				</ion-item>
			</ion-col>
		</ion-row>			
		<ion-row >
			<ion-col >
				<ion-item >
					<ion-checkbox name="cell" [(ngModel)]="nuovoContatto.cell" color="danger" >Cellulare/Email/TG</ion-checkbox>
				</ion-item>
			</ion-col>
		</ion-row>

		<ion-row >
			<ion-col >		
				<ion-item >
					<ion-checkbox name="home" [(ngModel)]="nuovoContatto.home" color="danger" >Rifugio</ion-checkbox>
				</ion-item>
			</ion-col>			
		</ion-row>
		<ion-row >
			<ion-col >
				<ion-item >
					<ion-input name="note" style="font-size:1em;"  type="text" placeholder="Altre annotazioni" [(ngModel)]="nuovoContatto.note" ></ion-input>
				</ion-item>
			</ion-col>
		</ion-row>
		<ion-row >
			<ion-col>
				<ion-button color="danger" shape="round" expand="full" type="submit" [disabled]="!addForm.form.valid">Aggiungi</ion-button>
			</ion-col>
		</ion-row>
	</form>
				

</ion-content>

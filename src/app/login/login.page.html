<ion-header>
  <ion-toolbar color="medium">
    <ion-title>Notturna - Young Blood - Login</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content padding>


  <ion-row >
    <ion-col class="alc">
      <img [src]="isDarkMode ? 'assets/img/logo-young-blood-dark.png' : 'assets/img/logo-young-blood.png'"/>
    </ion-col>
  </ion-row>

  <div class="login-box">
    <form (ngSubmit)="login()" #registerForm="ngForm">
      <ion-row>
        <ion-col>
          <ion-list >

            <ion-item>
              <ion-input  type="text" placeholder="Username" name="username" [(ngModel)]="registerCredentials.username" required></ion-input>
            </ion-item>

            <ion-item>
              <ion-input type="password" placeholder="Password" name="password" [(ngModel)]="registerCredentials.password" required>
                <ion-input-password-toggle slot="end"></ion-input-password-toggle>
              </ion-input>
            </ion-item>

          </ion-list>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col class="signup-col">
          <ion-button id="open-loading" color="danger" shape="round" expand="full" type="submit" [disabled]="!registerForm.form.valid">Login</ion-button>
          <!-- <button ion-button="" color="smallgray" class="register-btn" full="" type="button" block="" clear="" (click)="createAccount()">registrati</button> -->
          <ion-loading trigger="open-loading" message="Loading..."  spinner="circles"></ion-loading>
        </ion-col>
      </ion-row>
        <ion-row>
        <ion-col size="1">
          <ion-checkbox name="saveme" checked="false" [(ngModel)]="saveme.checked" style="vertical-align:middle;" ></ion-checkbox>
        </ion-col>
				<ion-col><div><ion-text color="medium">Ricordami</ion-text></div></ion-col>
      </ion-row>
      <ion-row>
        <ion-col>&nbsp;</ion-col>
      </ion-row>
      <ion-row>
        <ion-col><div style=" font-size:0.75em;"><ion-text color="medium">v 3.0.09 (Aurelius) </ion-text></div></ion-col>
      </ion-row>
    </form>
  </div>
</ion-content>
